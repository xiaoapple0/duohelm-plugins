[project]
name = "duohelm-plugins"
version = "0.0.0"
description = "DuoHelm 官方插件的开发环境（不发布）"
requires-python = ">=3.12"
dependencies = [
    "duohelm-sdk",
    "eltdx==3.3.5",  # 固定版本：插件的行为和录制的测试数据都基于这个版本
    "polars>=1.0",
    # Windows 上的 Python 没有自带时区数据库：日期要按 Asia/Shanghai 换算（含 1986–1991 年夏令时）
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# xtdata 插件连接 MiniQMT 时，xtquant 运行时需要 pandas 和 numpy（插件本身不 import 它们）。
# 只用回放数据（测试）不需要：uv sync --extra live
live = [
    "pandas>=2.2",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "numpy>=2.0",  # 仅供类型检查：polars 的类型标注引用 numpy.ndarray
]

[tool.uv]
package = false

[tool.uv.sources]
# duohelm-sdk 0.4.2（duohelm 仓库 main，含 LookupFailedError，xiaoapple0/duohelm#56）
duohelm-sdk = { git = "https://github.com/xiaoapple0/duohelm", rev = "f3786e3d26acc7577fadac16d11ae01300110b7b", subdirectory = "packages/duohelm-sdk" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "DTZ", "PL", "TID",
]
ignore = [
    "PLR2004",  # 测试里的魔法数字
    "PLR0913",  # 参数个数
    "RUF001", "RUF002", "RUF003",  # 中文全角标点
]

[tool.ruff.lint.isort]
known-first-party = ["duohelm_eltdx", "duohelm_xtdata"]

[tool.pyright]
include = ["plugins", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["plugins/eltdx/duohelm_eltdx", "plugins/xtdata/duohelm_xtdata"]
extraPaths = ["plugins/eltdx", "plugins/eltdx/tests", "plugins/xtdata", "plugins/xtdata/tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["plugins/eltdx/tests", "plugins/xtdata/tests"]
pythonpath = ["plugins/eltdx", "plugins/eltdx/tests", "plugins/xtdata", "plugins/xtdata/tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "local_data: 需要 .local-data/ 下的本地录制文件（不进仓库，目录可用环境变量 DUOHELM_LOCAL_DATA 指定）；CI 用 -m \"not local_data\" 排除",
]
